<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Viewer</title>
    <style>
        @font-face {
            font-family: "Gilroy";
            src: local("Gilroy Light"), url("./assets/fonts/Gilroy/Gilroy-Light.otf") format("opentype");
        }

        @font-face {
            font-family: "Gilroy Bold";
            src: local("Gilroy ExtraBold"), url("./assets/fonts/Gilroy/Gilroy-ExtraBold.otf") format("opentype");
        }

        :root {
            --bg-color: #1DA4EB;
            --main-color: #35B8FC;
            --text-color: #2C2D6E;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            -webkit-user-drag: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sequence {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        #sequence img {
            object-fit: cover;
            width: 100vw;
            height: 100vh; 
        }

        #warning {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #warning span {
            font-family: Gilroy, Arial, Helvetica, sans-serif;
            font-size: 30px;
            color: white;
        }

        .pin {
            position: absolute;
            transform: translate(-50%, -50%);
            height: 30px;
            padding: 0 20px;
            gap: 10px;
            background-color: #FFFFFF;
            border-radius: 24px;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: -1;
        }

        .pin span {
            color: var(--text-color);
            font-family: Gilroy, Arial, Helvetica, sans-serif;
            font-size: 18px;
            font-weight: 700;
        }

        #preloader {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
        }

        #loading {
            color: white;
            font-family: Gilroy, Arial;
            font-size: 64px;
            font-weight: 700;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9997;
            pointer-events: none;
        }

        #ui div {
            pointer-events: all;
        }

        .logo {
            position: fixed;
            top: 42px;
            left: 50px;
            width: 135px;
            height: 32px;
            z-index: 9999;
        }

        .navigator {
            position: fixed;
            top: 50px;
            right: 45px;
            width: 50px;
            height: 50px;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        #menuButton {
            background-color: var(--main-color);
            position: fixed;
            bottom: 50px;
            right: 50px;
            width: 200px;
            height: 50px;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #menuButton span {
            color: white;
            font-family: Gilroy, Arial;
            font-size: 15px;
            font-weight: 600;
        }

        .right {
            position: absolute;
            right: 15px;
            width: 25px;
            height: 25px;
        }

        #menuOverlay {
            position: fixed;
            bottom: 120px;
            right: 50px;
            background-color: #F3F5FC;
            width: 415px;
            height: 220px;
            border-radius: 20px;
            padding: 20px;
            justify-content: center;
            flex-direction: column;
            gap: 50px;
        }

        .header {
            width: 100%;
            height: fit-content;
        }

        .header span {
            color: var(--text-color);
            font-family: 'Gilroy Bold', Arial;
            font-size: 36px;
            font-weight: 600;
            line-height: 45px;
        }

        .buttons {
            width: 100%;
            height: fit-content;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 15px;
        }

        .button {
            height: 50px;
            padding: 0 20px;
            gap: 10px;
            background-color: #FFFFFF;
            color: var(--text-color);
            border-radius: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .button span {
            font-family: Gilroy, Arial;
            font-size: 18px;
            font-weight: 600;
        }

        .selected {
            background-color: var(--main-color);
            color: #FFFFFF;
        }
    </style>
</head>
<body>
